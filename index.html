<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>know your boyfriend test ♡</title>
<style>
  :root {
    --pink: #ffb3de;
    --sky: #9ad8ff;
    --lav: #cdb4ff;
    --mint: #b5f5d0;
    --lemon: #fff3a8;
    --rose: #ff9fb8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #000; color: var(--pink);
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    overflow: hidden; -webkit-tap-highlight-color: transparent;
  }

  /* twinkling text-character stars in the background */
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #stars span { position: absolute; font-size: 14px; opacity: 0; animation: twinkle 4s infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0; } 50% { opacity: .8; } }

  .screen {
    position: fixed; inset: 0; z-index: 1; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 18px;
  }
  .screen.active { display: flex; animation: fadein .6s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  .deco { color: var(--sky); white-space: pre; letter-spacing: 2px; font-size: 14px; }
  .deco.lav { color: var(--lav); }
  h1 { margin: 0; font-size: clamp(26px, 7vw, 48px); color: var(--pink); letter-spacing: 1px; line-height: 1.2; }
  .sub { color: var(--lav); font-size: 15px; margin: 0; }
  .progress { color: var(--mint); font-size: 14px; white-space: pre; }
  .question { color: var(--lemon); font-size: clamp(19px, 5vw, 28px); max-width: 640px; line-height: 1.4; min-height: 2.8em; margin: 0; }

  input {
    background: transparent; border: none; border-bottom: 2px dashed var(--sky);
    color: var(--pink); font: inherit; font-size: 20px; text-align: center;
    outline: none; width: min(80vw, 340px); padding: 6px; caret-color: var(--lemon);
  }
  input::placeholder { color: #555; }

  .btn {
    background: transparent; border: none; color: var(--mint); font: inherit;
    font-size: 18px; cursor: pointer; padding: 8px 12px; white-space: nowrap;
  }
  .btn::before { content: "[ "; color: var(--sky); }
  .btn::after  { content: " ]"; color: var(--sky); }
  .btn:hover { color: var(--pink); }

  .msg { min-height: 1.5em; font-size: 17px; margin: 0; }
  .msg.wrong { color: var(--rose); }
  .msg.right { color: var(--mint); }

  .shake { animation: shake .45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); } 40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }  80% { transform: translateX(6px); }
  }

  /* kiss question */
  .kiss-btns { display: flex; gap: 40px; align-items: center; justify-content: center; min-height: 120px; }
  #yes { color: var(--pink); font-size: 22px; transition: transform .2s ease; }
  #no  { color: var(--sky); font-size: 18px; transition: left .18s ease, top .18s ease; z-index: 5; }

  /* pass screen */
  .rainbow span { animation: rainbow 2s linear infinite; display: inline-block; }
  @keyframes rainbow {
    0%   { color: var(--pink); }  20% { color: var(--lemon); }
    40%  { color: var(--mint); }  60% { color: var(--sky); }
    80%  { color: var(--lav); }   100% { color: var(--pink); }
  }
  .blink { animation: blink 1.1s steps(2, start) infinite; font-size: 20px; color: var(--lemon); }
  @keyframes blink { to { visibility: hidden; } }

  /* present */
  #present { position: relative; display: flex; flex-direction: column; align-items: center; }
  #present pre { margin: 0; font: inherit; font-size: clamp(20px, 6.5vw, 34px); line-height: 1.1; }
  #lid { transition: transform .9s cubic-bezier(.2,.8,.3,1), opacity .9s ease; }
  #lid.open { transform: translate(-30px, -170px) rotate(-28deg); opacity: 0; }
  #present.wiggle { animation: wiggle .25s infinite; }
  @keyframes wiggle {
    0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); }
  }
  #present.fade { transition: opacity .6s ease, transform .6s ease; opacity: 0; transform: scale(.7); }
  .spark { position: absolute; left: 50%; top: 45%; font-size: 22px; pointer-events: none;
           transition: transform 1s ease-out, opacity 1s ease-out; }
  .tap-hint { color: #666; font-size: 13px; }

  /* bouquet */
  #bouquet { position: fixed; inset: 0; margin: 0; z-index: 2; white-space: pre; overflow: hidden; color: #fff; }
  #measure { position: absolute; visibility: hidden; white-space: pre; }
</style>
</head>
<body>

<div id="stars"></div>

<!-- 0. title -->
<section class="screen active" id="s-title">
  <div class="deco">─── ♡ ─── ✿ ─── ♡ ───</div>
  <h1 id="titleText">know your boyfriend test</h1>
  <p class="sub">4 questions. no cheating. he will know.</p>
  <div class="deco lav">_.·´¯`·._.·´¯`·._</div>
  <button class="btn" id="startBtn">start</button>
</section>

<!-- 1-3. typed questions -->
<section class="screen" id="s-q">
  <div class="progress" id="progress"></div>
  <p class="question" id="qText"></p>
  <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here...">
  <button class="btn" id="submitBtn">enter</button>
  <p class="msg" id="qMsg"></p>
</section>

<!-- 4. kiss promise -->
<section class="screen" id="s-kiss">
  <div class="progress">─── question 4 / 4 ───</div>
  <p class="question" id="kissText"></p>
  <div class="kiss-btns">
    <button class="btn" id="yes">yes</button>
    <button class="btn" id="no">no</button>
  </div>
</section>

<!-- 5. pass -->
<section class="screen" id="s-pass">
  <div class="deco">✦ · ✦ · ✦ · ✦ · ✦</div>
  <h1 class="rainbow" id="passText">YOU PASS THE TEST!!</h1>
  <p class="sub">score: 4/4 ♡ certified girlfriend</p>
  <div class="deco lav">─────────────────</div>
  <button class="btn blink" id="claimBtn">click here to get ur reward</button>
</section>

<!-- 6. present -->
<section class="screen" id="s-present">
  <div id="present">
    <pre id="lid"></pre>
    <pre id="box"></pre>
  </div>
  <p class="tap-hint" id="presentHint">opening...</p>
</section>

<!-- 7. bouquet -->
<pre id="bouquet" style="display:none"></pre>
<span id="measure"></span>

<script>
/* ===================================================================
   EDIT THESE: the answers she has to type (not case sensitive,
   spaces and punctuation are ignored, so "Giann!!" = "giann")
   =================================================================== */
const CONFIG = {
  boyfriendName:   ["giann", "gian", "giann carlo", "giann carlo pesalbon"],
  lovesMost:       ["me", "you", "her"],          // <- add her name / nicknames here
  favouriteFlower: ["carnation", "carnations"],
  wrongMessage:    "wrong, try again baby 😤💔",
  bouquetMessage:  "happy monthsary ♥",
};

const QUESTIONS = [
  { text: "What's the name of your boyfriend?",              answers: CONFIG.boyfriendName },
  { text: "Who does he love the most in da entire world?",   answers: CONFIG.lovesMost },
  { text: "What is his girlfriend's favourite flower?",      answers: CONFIG.favouriteFlower },
];
const KISS_TEXT = "Will ya promise to passionately kiss him because he crashed out for 3 hours debugging this?";
const NO_LINES = ["no", "are u sure??", "3 HOURS 😭", "think again 😤", "pls 🥺", "wrong button",
                  "nuh uh", "try the other one", "he debugged for u...", "error 404: no not found"];

const $ = id => document.getElementById(id);
const PASTELS = ["#ffb3de", "#9ad8ff", "#cdb4ff", "#b5f5d0", "#fff3a8"];

/* ---------- background stars ---------- */
(function makeStars() {
  const chars = ["·", "✦", "+", "*", "·", "♡"];
  for (let i = 0; i < 45; i++) {
    const s = document.createElement("span");
    s.textContent = chars[i % chars.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.top = Math.random() * 100 + "vh";
    s.style.color = PASTELS[i % PASTELS.length];
    s.style.animationDelay = (-Math.random() * 4) + "s";
    s.style.animationDuration = (3 + Math.random() * 3) + "s";
    $("stars").appendChild(s);
  }
})();

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  if (id) $(id).classList.add("active");
}

function typeText(el, text, done) {
  el.textContent = "";
  let i = 0;
  const chars = Array.from(text);
  const tick = () => {
    el.textContent += chars[i++] || "";
    if (i < chars.length) setTimeout(tick, 28); else if (done) done();
  };
  tick();
}

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");

function shake(el) {
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
}

/* ---------- questions ---------- */
let qi = 0, locked = false;

function showQuestion() {
  show("s-q");
  $("progress").textContent = `─── question ${qi + 1} / 4 ───`;
  $("answer").value = "";
  $("qMsg").textContent = "";
  $("qMsg").className = "msg";
  locked = false;
  typeText($("qText"), QUESTIONS[qi].text, () => $("answer").focus());
}

function submitAnswer() {
  if (locked) return;
  const val = norm($("answer").value);
  if (!val) { shake($("answer")); return; }
  const ok = QUESTIONS[qi].answers.some(a => norm(a) === val);
  const msg = $("qMsg");
  if (ok) {
    locked = true;
    msg.textContent = ["correct!! ♡", "yesss 💖", "obviously ✿"][qi % 3];
    msg.className = "msg right";
    setTimeout(() => { qi++; qi < QUESTIONS.length ? showQuestion() : showKiss(); }, 1000);
  } else {
    msg.textContent = CONFIG.wrongMessage;
    msg.className = "msg wrong";
    shake($("answer"));
  }
}

$("startBtn").onclick = () => { qi = 0; showQuestion(); };
$("submitBtn").onclick = submitAnswer;
$("answer").addEventListener("keydown", e => { if (e.key === "Enter") submitAnswer(); });

/* ---------- kiss: the runaway "no" button ---------- */
let dodges = 0, noFloating = false;
const yesBtn = $("yes"), noBtn = $("no");

function showKiss() {
  show("s-kiss");
  typeText($("kissText"), KISS_TEXT);
}

function dodge(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  dodges++;
  yesBtn.style.transform = `scale(${Math.min(1 + dodges * 0.3, 5)})`;
  noBtn.textContent = NO_LINES[dodges % NO_LINES.length];

  if (!noFloating) {               // detach it so it can run anywhere on screen
    const r = noBtn.getBoundingClientRect();
    document.body.appendChild(noBtn);
    noBtn.style.position = "fixed";
    noBtn.style.left = r.left + "px";
    noBtn.style.top = r.top + "px";
    noFloating = true;
    void noBtn.offsetWidth;
  }
  const nb = noBtn.getBoundingClientRect();
  const yb = yesBtn.getBoundingClientRect();
  const W = window.innerWidth, H = window.innerHeight;
  let x = 0, y = 0;
  for (let tries = 0; tries < 40; tries++) {
    x = 10 + Math.random() * Math.max(0, W - nb.width - 20);
    y = 10 + Math.random() * Math.max(0, H - nb.height - 20);
    const farFromOld = Math.hypot(x - nb.left, y - nb.top) > 140;
    const offYes = x + nb.width < yb.left - 10 || x > yb.right + 10 || y + nb.height < yb.top - 10 || y > yb.bottom + 10;
    if (farFromOld && offYes) break;
  }
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

noBtn.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") dodge(e); });
noBtn.addEventListener("touchstart", dodge, { passive: false });
noBtn.addEventListener("click", dodge);

yesBtn.onclick = () => {
  noBtn.remove();
  show("s-pass");
};

/* ---------- pass screen ---------- */
(function rainbowLetters() {
  const el = $("passText");
  const text = Array.from(el.textContent);
  el.textContent = "";
  text.forEach((ch, i) => {
    const s = document.createElement("span");
    s.textContent = ch === " " ? " " : ch;
    s.style.animationDelay = (-i * 0.12) + "s";
    el.appendChild(s);
  });
})();

$("claimBtn").onclick = openPresent;

/* ---------- present ---------- */
const LID = [
  "    .-.   .-.    ",
  "   (   \\ /   )   ",
  "    '-._Y_.-'    ",
  " _______|_______ ",
  "|_______|_______|",
];
const BOX = [
  "|       |       |",
  "|   *   |   *   |",
  "|       |       |",
  "|_______|_______|",
];

function colorize(lines, isLid) {
  return lines.map((line, r) => Array.from(line).map((ch, c) => {
    if (ch === " ") return " ";
    let col = "#ffb3de";
    if (isLid && r < 3) col = "#9ad8ff";
    else if (c === 8) col = "#9ad8ff";
    else if (ch === "*") col = "#fff3a8";
    return `<span style="color:${col}">${ch.replace("\\", "&#92;")}</span>`;
  }).join("")).join("\n");
}

function openPresent() {
  show("s-present");
  const lid = $("lid"), box = $("box"), present = $("present");
  lid.innerHTML = colorize(LID, true);
  box.innerHTML = colorize(BOX, false);
  lid.classList.remove("open");
  present.classList.remove("fade");
  present.classList.add("wiggle");

  setTimeout(() => {
    present.classList.remove("wiggle");
    lid.classList.add("open");
    burst(present);
    $("presentHint").textContent = "♡";
  }, 1600);
  setTimeout(() => present.classList.add("fade"), 2400);
  setTimeout(startBouquet, 3000);
}

function burst(parent) {
  const chars = ["✦", "*", "+", "·", "♡", "✿"];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement("span");
    s.className = "spark";
    s.textContent = chars[i % chars.length];
    s.style.color = PASTELS[i % PASTELS.length];
    parent.appendChild(s);
    const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 140;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      s.style.transform = `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d - 60}px) scale(1.4)`;
      s.style.opacity = "0";
    }));
    setTimeout(() => s.remove(), 1200);
  }
}

/* ===================================================================
   THE BOUQUET
   Ported from the Python terminal bouquet (by @alishsharma on tiktok)
   to JavaScript, with blue + white carnations as the main flower.
   Everything is drawn with plain text characters.
   =================================================================== */

// palettes go dark -> light
const BLUE     = ["#1b3f73", "#2c64a8", "#4a8fd6", "#74b6f2", "#9fd3ff", "#c9e8ff"];
const WHITE    = ["#5e6470", "#8d96a3", "#b9c2cd", "#dde4ec", "#f2f6fa", "#ffffff"];
const PINK_T   = ["#7a2d55", "#b04a80", "#e07ab0", "#ff9fcf", "#ffc4e3"];
const LAV_T    = ["#4b3a7a", "#7a62b8", "#a68cf0", "#c9b6ff", "#e4d9ff"];
const GREENS   = ["#173d22", "#22562f", "#2e703c", "#3d8a4a", "#5aaa62", "#7fcf82", "#a8eaa6"];
const PAPER    = ["#4a2a3a", "#7a4560", "#b06a8c", "#e095b6", "#ffbfdb", "#ffe2ef"];
const RIBBON   = ["#1b3f73", "#2c64a8", "#4a8fd6", "#74b6f2", "#9fd3ff", "#c9e8ff"];
const HEART_COLORS = ["#ff7eb6", "#ff9fcf", "#ffb3de", "#9ad8ff", "#cdb4ff", "#ffc4e3"];
const MSG_COLORS   = ["#ffb3de", "#ff9fcf", "#cdb4ff", "#9ad8ff", "#b5f5d0", "#fff3a8", "#b5f5d0", "#9ad8ff", "#cdb4ff", "#ff9fcf"];
const SHADE = ".:-=+*%@";
const PETAL_SHADE = "+*#%";
const CARN_SHADE = "+*#%@";

// [main colour, frilly edge colour (null = same)]
const CARN_TYPES = [
  [BLUE, null], [WHITE, null], [WHITE, BLUE], [BLUE, WHITE], [WHITE, null], [BLUE, null],
];
const TULIP_COLORS = [PINK_T, LAV_T];

const SPIN_SPEED = 0.6, TILT = 0.30, CAM_DIST = 4.0, NUM_HEARTS = 18, PIVOT_Y = 0.2;
const _L = [-0.45, 0.6, 0.66], _n = Math.hypot(..._L);
const LX = _L[0] / _n, LY = _L[1] / _n, LZ = _L[2] / _n;

function rng(seed) {             // small seeded random so the bouquet looks the same every time
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const norm3 = v => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / m, v[1] / m, v[2] / m]; };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const add = (p, d, k) => [p[0] + d[0] * k, p[1] + d[1] * k, p[2] + d[2] * k];

function buildScene() {
  const r = rng(21);
  const uni = (a, b) => a + (b - a) * r();
  const pts = [];
  const neck = [0, -0.12, 0];
  const C = [0, 0.12, 0], D = 0.64, N = 10;
  const golden = Math.PI * (3 - Math.sqrt(5));

  const heads = [];
  for (let i = 0; i < N; i++) {
    const el = (88 - 60 * Math.sqrt(i / (N - 1))) * Math.PI / 180;
    const az = i * golden;
    const d = [Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)];
    heads.push([add(C, d, D * uni(0.92, 1.05)), norm3(d)]);
  }

  const tulipSlots = new Set([3, 8]);
  const flowers = [];
  let ci = 0, ti = 0;
  heads.forEach(([pos, axis], idx) => {
    const base = add(pos, axis, -0.03);
    for (let j = 0; j < 70; j++) {                       // stems
      const t = j / 69;
      pts.push([base[0] + (neck[0] - base[0]) * t, base[1] + (neck[1] - base[1]) * t,
                base[2] + (neck[2] - base[2]) * t, axis[0], 0, axis[2], GREENS, -0.15, true, null]);
    }
    if (tulipSlots.has(idx)) {
      flowers.push({ pos, kind: "tulip", pal: TULIP_COLORS[ti++ % 2], R: 0.10, seed: uni(0, 6.28) });
    } else {
      const [pal, edge] = CARN_TYPES[ci++ % CARN_TYPES.length];
      flowers.push({ pos, kind: "carn", pal, edge, R: uni(0.13, 0.155), seed: uni(0, 6.28) });
    }
  });

  for (let i = 0; i < 8; i++) {                           // leaves
    const a = (i + 0.4) / 8 * 2 * Math.PI, c = Math.cos(a), s = Math.sin(a);
    const base = [0.26 * c, 0.30, 0.26 * s];
    const d = norm3([c, 0.15, s]);
    const side = [-s, 0, c];
    const n = norm3(cross(side, d));
    const L = 0.30, W = 0.07;
    for (let t_i = 0; t_i < 32; t_i++) {
      const t = t_i / 31;
      for (let wi = -5; wi <= 5; wi++) {
        const w = wi / 5, curl = 0.025 * w * w;
        pts.push([base[0] + d[0] * L * t + side[0] * W * Math.sin(Math.PI * t) * w + n[0] * curl,
                  base[1] + d[1] * L * t - 0.10 * t * t + n[1] * curl,
                  base[2] + d[2] * L * t + side[2] * W * Math.sin(Math.PI * t) * w + n[2] * curl,
                  n[0], n[1], n[2], GREENS, wi === 0 ? -0.25 : 0, true, null]);
      }
    }
  }

  const y0 = -0.20, y1 = 0.30, r0 = 0.06, r1 = 0.36;   // wrapping paper cone
  const k = (r1 - r0) / (y1 - y0);
  const rings = 50;
  for (let i = 0; i < rings; i++) {
    const t = i / (rings - 1);
    const rad = r0 + (r1 - r0) * t;
    const count = Math.max(8, Math.floor(170 * rad));
    for (let j = 0; j < count; j++) {
      const ph = (j + r()) / count * 2 * Math.PI, c = Math.cos(ph), s = Math.sin(ph);
      let y = y0 + (y1 - y0) * t;
      if (t > 0.9) y += 0.03 * Math.sin(9 * ph);
      const fold = 0.3 * (Math.abs(Math.sin(5 * ph)) - 0.6);
      const nn = norm3([c, -k, s]);
      pts.push([rad * c, y, rad * s, nn[0], nn[1], nn[2], PAPER, fold, false, null]);
    }
  }

  for (let i = 0; i < 7; i++) {                           // stem ends under the cone
    const a = i / 7 * 2 * Math.PI, sx = 0.025 * Math.cos(a), sz = 0.025 * Math.sin(a);
    for (let j = 0; j < 40; j++) {
      const t = j / 39;
      pts.push([sx * (1 + 1.2 * t), -0.20 - 0.30 * t, sz * (1 + 1.2 * t),
                Math.cos(a), 0, Math.sin(a), GREENS, -0.1, true, null]);
    }
  }

  const by = -0.12, br = r0 + k * (by - y0) + 0.01;       // ribbon + bow
  for (let j = 0; j < 90; j++) {
    const ph = j / 90 * 2 * Math.PI;
    for (const dy of [-0.012, 0, 0.012])
      pts.push([br * Math.cos(ph), by + dy, br * Math.sin(ph), Math.cos(ph), 0, Math.sin(ph), RIBBON, 0, false, null]);
  }
  const knot = [0, by, br + 0.01];
  for (const side of [-1, 1]) {
    for (let j = 0; j < 70; j++) {
      const a = j / 70 * 2 * Math.PI;
      const lx = side * (0.07 + 0.07 * Math.cos(a));
      const ly = 0.04 * Math.sin(a) + 0.02 * (0.07 + 0.07 * Math.cos(a)) / 0.14;
      for (const fill of [1.0, 0.7])
        pts.push([knot[0] + lx * fill, knot[1] + ly * fill, knot[2] + 0.01, side * 0.3, 0.2, 0.93, RIBBON, 0.1, true, null]);
    }
    for (let j = 0; j < 30; j++) {
      const t = j / 29;
      pts.push([knot[0] + side * 0.06 * t, knot[1] - 0.15 * t, knot[2] + 0.015,
                side * 0.2, 0, 0.98, RIBBON, -0.05 + 0.05 * Math.sin(t * 9), true, null]);
    }
  }
  for (const dx of [-0.01, 0, 0.01]) pts.push([dx, by, knot[2] + 0.02, 0, 0, 1, RIBBON, 0.2, true, "@"]);

  const babies = [];                                      // baby's breath
  for (let i = 0; i < 90; i++) {
    const a = r() * 2 * Math.PI, el = uni(0.3, 1.4), rr = uni(0.40, 0.58);
    babies.push([rr * Math.cos(a) * Math.cos(el), C[1] + rr * Math.sin(el), rr * Math.sin(a) * Math.cos(el), uni(0, 6.28)]);
  }
  const sparkles = [];
  for (let i = 0; i < 30; i++) {
    const a = r() * 2 * Math.PI, rr = uni(0.75, 0.95);
    sparkles.push([rr * Math.cos(a), uni(-0.3, 1.0), rr * Math.sin(a), uni(0, 6.28), uni(1.5, 4.0)]);
  }
  return { pts, flowers, babies, sparkles };
}

let scene = null, hearts = [], cols = 80, rows = 40, ratio = 2;

function updateHearts(dt) {
  while (hearts.length < NUM_HEARTS)
    hearts.push([Math.random(), 1 + Math.random(), 0.03 + Math.random() * 0.05, Math.random() * 6.28,
                 HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)]]);
  for (const h of hearts) {
    h[1] -= h[2] * dt;
    if (h[1] < 0) { h[0] = Math.random(); h[1] = 1; h[4] = HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)]; }
  }
}

const clamp01 = b => Math.min(0.999, Math.max(0, b));

function render(t, grow) {
  const total = cols * rows;
  const chars = new Array(total).fill(" ");
  const colors = new Array(total).fill(null);
  const zbuf = new Float32Array(total).fill(-1e9);
  const viewRows = rows - 3;

  const fullScale = Math.max(1, Math.min((viewRows - 2) / 1.45, (cols - 2) / (1.35 * ratio)));
  const scale = fullScale * Math.max(0.02, grow);
  const sxScale = scale * ratio;
  const cx = cols / 2;
  const finalCy = Math.max(1 + 0.78 * fullScale, (viewRows - 1.45 * fullScale) / 2 + 0.78 * fullScale);
  const cy = finalCy + (1 - grow) * viewRows * 0.35;       // rises up out of the box

  const ang = t * SPIN_SPEED + (1 - grow) * 3;
  const ca = Math.cos(ang), sa = Math.sin(ang), ct = Math.cos(TILT), st = Math.sin(TILT);

  function projectF(x, y, z) {
    const xr = x * ca - z * sa, zr = x * sa + z * ca;
    const yp = y - PIVOT_Y;
    const yt = yp * ct - zr * st, zt = yp * st + zr * ct;
    const f = CAM_DIST / (CAM_DIST - zt);
    return [cx + xr * f * sxScale, cy - yt * f * scale, zt, f];
  }
  function plot(col, row, z, ch, color) {
    if (row >= 0 && row < viewRows && col >= 0 && col < cols) {
      const i = row * cols + col;
      if (z > zbuf[i]) { zbuf[i] = z; chars[i] = ch; colors[i] = color; }
    }
  }

  for (const [x, y, , phase, color] of hearts) {
    const col = ((Math.floor((x + 0.015 * Math.sin(t * 1.2 + phase)) * cols) % cols) + cols) % cols;
    plot(col, Math.floor(y * viewRows), -50, "♥", color);
  }

  for (const [x, y, z, nx, ny, nz, pal, tone, twoSided, override] of scene.pts) {
    const [px, py, zt] = projectF(x, y, z);
    const nxr = nx * ca - nz * sa, nzr = nx * sa + nz * ca;
    const nyt = ny * ct - nzr * st, nzt = ny * st + nzr * ct;
    let dot = nxr * LX + nyt * LY + nzt * LZ;
    if (twoSided && dot < 0) dot = -dot * 0.55;
    const b = clamp01(0.25 + 0.75 * Math.max(0, dot) + tone);
    plot(Math.floor(px), Math.floor(py), zt, override || SHADE[Math.floor(b * SHADE.length)], pal[Math.floor(b * pal.length)]);
  }

  for (const fl of scene.flowers) {
    const [fx, fy, zt, f] = projectF(fl.pos[0], fl.pos[1], fl.pos[2]);
    const rx = fl.R * f * sxScale, ry = fl.R * f * scale;
    if (rx < 0.5) continue;
    const dim = -0.4 * (1 - Math.min(1, Math.max(0, (zt + 0.6) / 1.2)));
    const rot = fl.seed + ang * 0.7;
    for (let row = Math.floor(fy - ry) - 1; row < Math.floor(fy + ry) + 2; row++) {
      const dy = (row + 0.5 - fy) / ry;
      for (let col = Math.floor(fx - rx) - 1; col < Math.floor(fx + rx) + 2; col++) {
        const dx = (col + 0.5 - fx) / rx;
        if (fl.kind === "carn") {
          // carnation: round head with a ragged, frilly edge and layered ruffles
          const s = Math.hypot(dx, dy);
          if (s > 1) continue;
          const ph = Math.atan2(dy, dx);
          const frill = 0.80 + 0.11 * Math.sin(15 * ph + rot * 3) + 0.07 * Math.sin(27 * ph + fl.seed);
          if (s > frill) continue;
          const ring1 = 0.55 + 0.06 * Math.sin(11 * ph + rot * 2);
          const ring2 = 0.28 + 0.05 * Math.sin(9 * ph + fl.seed * 2);
          const layerEdge = Math.abs(s - ring1) < 0.07 || Math.abs(s - ring2) < 0.06;
          const ruff = Math.sin(13 * ph + s * 10 + rot);
          const outer = s > frill - 0.12;
          let b = 0.64 - 0.2 * dx - 0.26 * dy + 0.12 * ruff + dim;
          if (layerEdge) b -= 0.25;
          if (outer) b -= 0.06;
          if (s < 0.13) b -= 0.18;
          b = clamp01(b);
          const pal = (fl.edge && s > frill - 0.22) ? fl.edge : fl.pal;
          const ch = outer ? (b > 0.5 ? "*" : "~") : CARN_SHADE[Math.floor(b * CARN_SHADE.length)];
          plot(col, row, zt + 0.04 * (1 - s), ch, pal[Math.floor(b * pal.length)]);
        } else {
          // tulip (accent flower), same as the original
          const v = (1 - dy) / 2;
          if (v < 0 || v > 1) continue;
          const hw = 0.62 * Math.sin(Math.PI * 0.5 * Math.min(1, v * 1.5 + 0.05));
          if (hw <= 0 || Math.abs(dx) > hw) continue;
          const xn = dx / hw;
          if (v > 0.72 + 0.28 * Math.cos(1.5 * Math.PI * xn) ** 2) continue;
          const seam = (Math.abs(Math.abs(xn) - 0.33) < 0.12 && v > 0.3) ? -0.25 : 0;
          const b = clamp01(0.55 - 0.3 * xn + 0.1 * v + seam + dim);
          plot(col, row, zt + 0.03, PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)], fl.pal[Math.floor(b * fl.pal.length)]);
        }
      }
    }
  }

  for (const [x, y, z, phase] of scene.babies) {
    const [px, py, zt] = projectF(x, y, z);
    const star = Math.sin(t * 2 + phase) > 0.6;
    plot(Math.floor(px), Math.floor(py), zt + 0.02, star ? "*" : "·", star ? "#ffffff" : "#d8dee8");
  }
  for (const [x, y, z, phase, speed] of scene.sparkles) {
    const [px, py, zt] = projectF(x, y, z);
    const tw = Math.sin(t * speed + phase);
    if (tw > 0.85) plot(Math.floor(px), Math.floor(py), zt, "*", "#ffffff");
    else if (tw > 0.4) plot(Math.floor(px), Math.floor(py), zt, "+", "#ffe0f0");
    else if (tw > 0) plot(Math.floor(px), Math.floor(py), zt, "·", "#ffb3de");
  }

  // message + credit
  const msg = Array.from(CONFIG.bouquetMessage);
  const mrow = rows - 3, start = Math.max(0, Math.floor((cols - msg.length) / 2)), shift = Math.floor(t * 6);
  msg.forEach((ch, i) => {
    if (start + i < cols) { chars[mrow * cols + start + i] = ch; colors[mrow * cols + start + i] = MSG_COLORS[(i + shift) % MSG_COLORS.length]; }
  });
  const hint = Array.from("bouquet based on code by @alishsharma (tiktok)");
  const hstart = Math.max(0, Math.floor((cols - hint.length) / 2));
  hint.forEach((ch, i) => {
    if (hstart + i < cols) { chars[(rows - 1) * cols + hstart + i] = ch; colors[(rows - 1) * cols + hstart + i] = "#444444"; }
  });

  // build the html, one <span> per run of the same colour
  const esc = ch => ch === "<" ? "&lt;" : ch === ">" ? "&gt;" : ch === "&" ? "&amp;" : ch;
  const out = [];
  for (let rr = 0; rr < rows; rr++) {
    let last = null, open = false, line = "";
    for (let c = 0; c < cols; c++) {
      const i = rr * cols + c, ch = chars[i];
      if (ch !== " " && colors[i] !== last) {
        if (open) line += "</span>";
        last = colors[i];
        line += `<span style="color:${last}">`;
        open = true;
      }
      line += esc(ch);
    }
    if (open) line += "</span>";
    out.push(line);
  }
  return out.join("\n");
}

function setupGrid() {
  const pre = $("bouquet"), m = $("measure");
  const W = window.innerWidth, H = window.innerHeight;
  const targetCols = W < 700 ? 74 : 120;
  const fs = Math.max(6, Math.min(15, W / targetCols / 0.6));
  pre.style.fontSize = fs + "px";
  pre.style.lineHeight = fs + "px";
  m.style.font = getComputedStyle(pre).font;
  m.style.fontSize = fs + "px";
  m.textContent = "M".repeat(100);
  const cw = m.getBoundingClientRect().width / 100 || fs * 0.6;
  cols = Math.max(20, Math.floor(W / cw));
  rows = Math.max(12, Math.floor(H / fs));
  ratio = fs / cw;
}

function startBouquet() {
  show(null);
  $("stars").style.display = "none";
  const pre = $("bouquet");
  pre.style.display = "block";
  scene = buildScene();
  setupGrid();
  window.addEventListener("resize", setupGrid);
  const t0 = performance.now();
  let last = t0, lastDraw = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (now - lastDraw < 1000 / 30) return;
    lastDraw = now;
    const dt = (now - last) / 1000; last = now;
    const t = (now - t0) / 1000;
    const g = Math.min(1, t / 2.4);
    const grow = 1 - Math.pow(1 - g, 3);              // ease-out
    updateHearts(dt);
    pre.innerHTML = render(t, grow);
  }
  requestAnimationFrame(frame);
}

// handy for testing: open the page with #bouquet at the end of the link to skip to the flowers
if (location.hash === "#bouquet") startBouquet();
</script>
